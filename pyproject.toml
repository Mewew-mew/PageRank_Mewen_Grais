[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wikipedia-pagerank-pyspark"
version = "0.1.0"
description = "PageRank classique et PageRank personnalisé (Nantes) sur Wikipedia en PySpark DataFrame"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Aligné sur Google Cloud Dataproc 2.2 (Apache Spark 3.5.x + Python 3.11)
    "pyspark>=3.5.0,<3.6.0",
    "networkx>=3.2",
    "scipy>=1.11",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
